name: Garmin Morning Sync (Diagnostic Mode)

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install latest dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "garminconnect>=0.3.16" curl_cffi requests python-dateutil

      - name: Run Garmin Sync with Full Diagnostics
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_IS_CN: ${{ secrets.GARMIN_IS_CN }}
          TP_AUTH_COOKIE: ${{ secrets.TP_AUTH_COOKIE }}
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_APPSECRET: ${{ secrets.WX_APPSECRET }}
          WX_ENV_ID: ${{ secrets.WX_ENV_ID }}
        run: |
          python sync.py

      - name: Commit and push updated data to GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto-update Garmin dashboard data [skip ci]" || exit 0
          git push
