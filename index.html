<script>
  async function loadDashboardData() {
    const statusElem = document.getElementById('sync-status');
    try {
      // 1. 追加毫秒时间戳与 no-store 头，彻底防止浏览器或 CDN 缓存旧 JSON
      const timestamp = new Date().getTime();
      const response = await fetch(`data.json?t=${timestamp}`, {
        cache: 'no-store',
        headers: { 'Cache-Control': 'no-cache' }
      });
      
      if (!response.ok) {
        throw new Error(`HTTP 错误: ${response.status}`);
      }

      const data = await response.json();

      // 2. 更新 TSB / CTL / ATL
      if (document.getElementById('val-tsb')) {
        const tsbSign = data.tsb > 0 ? `+${data.tsb}` : `${data.tsb}`;
        document.getElementById('val-tsb').innerText = tsbSign;
      }
      if (document.getElementById('val-ctl-atl')) {
        document.getElementById('val-ctl-atl').innerText = `长期体能 CTL: ${data.ctl} | 疲劳 ATL: ${data.atl}`;
      }

      // 3. 更新睡眠与电量
      if (data.recovery) {
        if (document.getElementById('val-sleep-hours')) {
          document.getElementById('val-sleep-hours').innerText = `${data.recovery.sleepHours}小时`;
        }
        if (document.getElementById('val-sleep-detail')) {
          document.getElementById('val-sleep-detail').innerText = `深睡 ${data.recovery.deepStr}, REM ${data.recovery.remStr} | 身体电量 ${data.recovery.bbChange}`;
        }
        if (document.getElementById('val-hrv')) {
          document.getElementById('val-hrv').innerText = `${data.recovery.hrvLastNight} ms`;
        }
        if (document.getElementById('val-hrv-detail')) {
          document.getElementById('val-hrv-detail').innerText = `状态: ${data.recovery.hrvStatus} · 静息心率 ${data.recovery.restingHR} bpm`;
        }
      }

      // 4. 更新最新跑步与去耦率
      if (data.activity) {
        if (document.getElementById('val-decoupling')) {
          document.getElementById('val-decoupling').innerText = `${data.activity.decoupling}%`;
        }
        if (document.getElementById('val-activity-title')) {
          document.getElementById('val-activity-title').innerText = `${data.activity.title} (${data.activity.distanceKm} km)`;
        }
      }

      // 5. 更新 AI 处方
      if (data.prescription) {
        if (document.getElementById('val-today-focus')) {
          document.getElementById('val-today-focus').innerText = `今日重点: ${data.prescription.todayFocus}`;
        }
        if (document.getElementById('val-drill-tips')) {
          document.getElementById('val-drill-tips').innerText = `跑姿与力量提点: ${data.prescription.drillTips}`;
        }
      }

      // 6. 成功同步后的状态更新
      if (statusElem) {
        statusElem.innerHTML = `<span style="color:#10b981;">●</span> 已同步最新 (${data.updateAt})`;
      }
    } catch (err) {
      console.warn("加载最新数据失败，显示内置底稿:", err);
      if (statusElem) {
        statusElem.innerText = "数据同步中，请稍后刷新";
      }
    }
  }

  // 页面加载时执行
  window.addEventListener('DOMContentLoaded', loadDashboardData);
</script>
